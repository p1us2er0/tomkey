CONFIG_ZMK_KEYBOARD_NAME="tomkey"

CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
CONFIG_PINCTRL=y


CONFIG_SPI=y
CONFIG_INPUT=y

# Axis inversion is set with invert-y in tomkey_R.overlay.
CONFIG_PMW3610_ALT=y
CONFIG_PMW3610_ALT_SMART_ALGORITHM=y
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=20

CONFIG_ZMK_BATTERY_REPORTING=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Deep sleep after 15 minutes without key or trackball input, unless USB
# powered. Press a key on this half to wake it.
CONFIG_ZMK_SLEEP=y
